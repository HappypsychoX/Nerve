services:
  socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: nerve-socket-proxy
    restart: unless-stopped
    # The socket mount is read-only and the proxy denies non-GET requests, so
    # privileged is not needed on standard Linux hosts. If your host enforces
    # SELinux/AppArmor and the proxy cannot reach the socket, uncomment:
    # privileged: true
    environment:
      # Read-only API areas only; POST is denied by default (only GET/HEAD pass).
      CONTAINERS: "1"   # /containers  (list, inspect, stats)
      IMAGES: "1"       # /images      (image count)
      INFO: "1"         # /info        (host MemTotal)
      SYSTEM: "1"       # /system/df   (disk usage)
      EVENTS: "1"       # /events      (unused in M1; enabled per plan §7)
      VERSION: "1"      # /version     (engine version)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - nerve-internal
    # No ports: private network only.

  nerve:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nerve
    restart: unless-stopped
    environment:
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - DOCKER_HOST=tcp://socket-proxy:2375
      - WUD_URL=http://wud:3000
      - OFFEN_WEBHOOK_TOKEN=${OFFEN_WEBHOOK_TOKEN:-}
      - GLUETUN_URL=${GLUETUN_URL:-http://gluetun:8000}
      - GLUETUN_API_KEY=${GLUETUN_API_KEY:-}
    volumes:
      - nerve-config:/app/config
      - nerve-data:/app/data
    ports:
      - "3001:3000"
    depends_on:
      - socket-proxy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - nerve-internal

networks:
  nerve-internal:
    driver: bridge

volumes:
  nerve-config:
  nerve-data:
