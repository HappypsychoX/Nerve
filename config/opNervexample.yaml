# Nerve — example configuration
#
# This is the default (non-secret) display configuration for Nerve.
# Copy it to config/nerve.yaml to customize, or point NERVE_CONFIG_PATH
# at your own file. Never commit secrets to either file — credentials
# belong in environment variables / Docker secrets.
#
# The config loader falls back to this file when config/nerve.yaml is absent.
# Production instead uses the inline nerve-display-config in
# deploy/portainer.compose.yaml at /run/configs/nerve.yaml. That template includes
# the active checkTls block and matching read-only certificate bind. Editing
# this fallback alone does not change an existing inline configuration.

# Title shown in the sidebar brand.
title: Nerve

# Name of the host this Nerve instance is describing.
serverName: Home Server

# Logical service groups, in display order.
groups:
  - id: media
    name: Media
  - id: downloads
    name: Downloads
  - id: infrastructure
    name: Infrastructure
  - id: monitoring
    name: Monitoring / Maintenance
  - id: remote-access
    name: Remote Access
  - id: other
    name: Other

# Internal services: quick links and read-only health checks.
# `url`     — public/open URL used for the quick-access shortcut.
# `checkUrl`— private URL Nerve will probe for reachability.
# `critical`— a critical service being down degrades overall health.
services:
  - id: portainer
    name: Portainer
    url: https://192.168.40.186:9443
    checkUrl: https://192.168.40.186:9443/api/system/status
    # Optional in this portable fallback; active in the Portainer template.
    # Mount a separately verified public cert/CA only for this probe.
    # The installed Portainer certificate has DNS SAN localhost, not the LAN IP.
    # Keep both certificate and hostname verification enabled; see
    # docs/Portainer-Health-TLS.md for fingerprint and deployment instructions.
    # checkTls:
    #   caFile: /run/configs/portainer-probe.pem
    #   serverName: localhost
    group: infrastructure
    critical: true

  - id: npm
    name: Nginx Proxy Manager
    url: https://192.168.40.186:81
    checkUrl: http://192.168.40.186:81
    group: infrastructure
    critical: true

  - id: jellyfin
    name: Jellyfin
    url: https://jellyfin.example.com
    checkUrl: http://jellyfin:8096
    group: media
    critical: true

  - id: jellyseerr
    name: Jellyseerr
    url: https://jellyseerr.example.com
    checkUrl: http://jellyseerr:5055
    group: media

  - id: wud
    name: WUD
    url: https://wud.example.com
    checkUrl: http://wud:3000
    group: monitoring

  - id: t3
    name: T3 Code
    url: https://t3.example.com
    group: remote-access

# Jellyfin activity section — display-only toggles.
#   enabled          — whether the Jellyfin section appears and polls.
#   showPosters      — fetch and show poster artwork.
#   showIdleClients  — list connected idle clients alongside playing/paused.
# Connection details (JELLYFIN_URL and JELLYFIN_API_KEY) live in environment
# variables, never here; do not add url, apiKey, or refreshIntervalSeconds to
# this block. Config changes require a container restart.
#
# Uncomment to enable; when absent the loader applies these same defaults.
# jellyfin:
#   enabled: true
#   showPosters: true
#   showIdleClients: true
